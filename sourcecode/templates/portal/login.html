{% load static %}

<!DOCTYPE html>
<html>

<head>
    <title>Examinee Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-blue-100 flex items-center justify-center">

    <div class="w-full max-w-md">

        <!-- Card -->

        <div class="bg-white shadow-2xl rounded-2xl px-8 py-10 border border-gray-100">

            <!-- Header -->
            <div class="text-center mb-8">
                <center>
                    <img src="{% static 'images/moist.png' %}" class="w-20 h-20 object-contain">
                </center>
                <h1 class="text-2xl font-bold text-gray-800 mt-4">
                    MCAT Portal
                </h1>

                <p class="text-gray-500 text-sm mt-1">
                    Enter your OR Number to continue
                </p>
            </div>

            <!-- Messages -->
            {% if messages %}
            {% for message in messages %}
            <div class="mb-4 px-4 py-2 rounded-lg text-sm 
                        {% if message.tags == 'error' %}
                            bg-red-50 text-red-600 border border-red-200
                        {% else %}
                            bg-green-50 text-green-600 border border-green-200
                        {% endif %}
                    ">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}

            <!-- Form -->
            <form method="POST" class="space-y-5">
                {% csrf_token %}

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">
                        OR Number
                    </label>

                    <input type="text" name="or_number" placeholder="e.g. 20260001" class="w-full px-4 py-3 border border-gray-300 rounded-xl 
                               focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500
                               transition" required>
                </div>

                <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-md transition duration-200">
                    Login
                </button>
            </form>

        </div>

        <!-- Footer -->
        <p class="text-center text-xs text-gray-400 mt-6">
            MOIST COMPUTERIZED ADMISSION TEST © 2026
        </p>

    </div>

</body>

</html>
