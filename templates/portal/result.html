<!DOCTYPE html>
<html>
<head>
    <title>Exam Result</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-lg">

    <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">
        Exam Result
    </h1>

    <div class="space-y-4 text-gray-700">

        <div class="flex justify-between">
            <span>Total Questions:</span>
            <span class="font-semibold">{{ total_questions }}</span>
        </div>

        <div class="flex justify-between">
            <span>Correct Answers:</span>
            <span class="text-green-600 font-semibold">{{ correct_answers }}</span>
        </div>

        <div class="flex justify-between">
            <span>Wrong Answers:</span>
            <span class="text-red-600 font-semibold">{{ wrong_answers }}</span>
        </div>

        <div class="flex justify-between">
            <span>Score:</span>
            <span class="font-bold">{{ score }}</span>
        </div>

        <div class="flex justify-between">
            <span>Percentage:</span>
            <span class="font-bold text-blue-600">{{ percentage }}%</span>
        </div>

    </div>

    <!-- Progress Bar -->
    <div class="mt-6 bg-gray-200 rounded-full h-4 overflow-hidden">
        <div
            class="bg-green-500 h-4"
            style="width: {{ percentage }}%;"
        ></div>
    </div>

    <!-- Button -->
    <div class="mt-6 text-center">
        <a href="{% url 'login' %}"
           class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg">
            Back to Login
        </a>
    </div>

</div>

</body>
</html>
